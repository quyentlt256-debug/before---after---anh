<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before & After Image Slider with Source</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }

        .comparison-slider {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9; 
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .comparison-slider img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .img-before {
            z-index: 2;
            clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
        }

        .img-after {
            z-index: 1;
        }

        .slider-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            outline: none;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
            z-index: 10;
            cursor: ew-resize;
        }

        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 5px;
            height: 100vh;
            background: transparent;
        }

        .slider-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background-color: white;
            z-index: 5;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .slider-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .slider-button::before,
        .slider-button::after {
            content: '';
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }
        .slider-button::before {
            border-right: 8px solid #333;
            margin-right: 4px;
        }
        .slider-button::after {
            border-left: 8px solid #333;
            margin-left: 4px;
        }

        /* CSS mới cho phần nguồn ảnh */
        .source-label {
            position: absolute;
            bottom: 15px;
            padding: 6px 12px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 14px;
            border-radius: 4px;
            z-index: 20; /* Đặt cao hơn thanh trượt để luôn hiển thị */
            pointer-events: none; /* Giúp chuột xuyên qua text, không cản trở việc kéo slider */
        }

        .source-before {
            left: 15px;
        }

        .source-after {
            right: 15px;
        }
    </style>
</head>
<body>

    <div class="comparison-slider">
        <img src="ltr8949-1730798514990831558004-1730800782129-17308007823771127305883.webp" alt="After" class="img-after">
        <img src="before chân cầu LB.webp" alt="Before" class="img-before" id="img-before">

        <!-- Các thẻ text chứa nguồn ảnh -->
        <div class="source-label source-before">Ảnh before: Cafebiz</div>
        <div class="source-label source-after">Ảnh after: Kênh 14</div>

        <div class="slider-line" id="slider-line"></div>
        <div class="slider-button" id="slider-button"></div>
        
        <input type="range" min="0" max="100" value="50" class="slider-input" id="slider-input">
    </div>

    <script>
        const sliderInput = document.getElementById('slider-input');
        const imgBefore = document.getElementById('img-before');
        const sliderLine = document.getElementById('slider-line');
        const sliderButton = document.getElementById('slider-button');

        sliderInput.addEventListener('input', (e) => {
            const sliderValue = e.target.value;
            imgBefore.style.clipPath = `polygon(0 0, ${sliderValue}% 0, ${sliderValue}% 100%, 0 100%)`;
            sliderLine.style.left = `${sliderValue}%`;
            sliderButton.style.left = `${sliderValue}%`;
        });
    </script>
</body>
</html>
